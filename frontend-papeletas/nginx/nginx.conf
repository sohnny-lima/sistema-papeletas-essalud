worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Cierre VM1: una línea JSON por petición con tiempos propios y del backend.
    # $uri va sin query string (búsquedas con nombres o DNI); sin cookies ni Authorization.
    log_format essalud_json escape=json '{"evento":"nginx","fecha":"$time_iso8601",'
        '"idPeticion":"$request_id","ip":"$remote_addr","metodo":"$request_method",'
        '"ruta":"$uri","estado":$status,"bytes":$body_bytes_sent,'
        '"duracion":"$request_time","backendConexion":"$upstream_connect_time",'
        '"backendCabecera":"$upstream_header_time","backendTotal":"$upstream_response_time",'
        '"backendEstado":"$upstream_status"}';
    access_log /dev/stdout essalud_json;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    map $upstream_http_cache_control $cache_api {
        default $upstream_http_cache_control;
        "" "no-store";
    }
    map $uri $cache_control {
        default "no-cache";
        /index.html "no-store";
        ~^/api/ $cache_api;
        "~*-[a-z0-9]{8,}[.](js|css|woff2?|png|svg|ico)$" "public, max-age=31536000, immutable";
    }
    # g033-5: detrás del proxy HTTPS se conserva «https»; cualquier otro valor del cliente se sustituye por el esquema propio.
    map $http_x_forwarded_proto $proto_original {
        https   https;
        default $scheme;
    }
    include /tmp/default.conf;
}
