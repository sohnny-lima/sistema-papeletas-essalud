# Producción · Sistema de papeletas EsSalud. Usa imágenes ya cargadas (docker load): no construye nada.
# Se maneja con los scripts del paquete (scripts/instalar.sh, comprobar.sh…); nunca «docker compose build».
x-registros: &registros
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-5}"

services:
  frontend:
    image: ${FRONTEND_IMAGE:-essalud/frontend}:${APP_VERSION:?Falta APP_VERSION}
    pull_policy: never
    environment:
      TZ: ${TZ:-America/Lima}
      BACKEND_URL: http://backend:3000
    # Por defecto solo el propio servidor: delante va el proxy HTTPS (institucional o compose.prod.tls.yml).
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    networks: [publica, api]
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${FRONTEND_MEMORY:-128m}
    logging: *registros

  backend:
    image: ${BACKEND_IMAGE:-essalud/backend}:${APP_VERSION:?Falta APP_VERSION}
    pull_policy: never
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${TZ:-America/Lima}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-papeletas}
      DB_USER: ${DB_USER:-papeletas_app}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-10000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-18000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}
      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED:-true}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # Saltos de proxy de confianza: 2 = proxy HTTPS + Nginx del frontend (ver documentacion/guia-instalacion.md).
      TRUST_PROXY: ${TRUST_PROXY:-2}
      CLIENT_URL: ${CLIENT_URL:-}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
    secrets: [db_password, jwt_secret]
    extra_hosts: [host.docker.internal:host-gateway]
    networks: [api, datos]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${BACKEND_MEMORY:-256m}
    logging: *registros

  operaciones:
    profiles: [herramientas]
    image: ${BACKEND_IMAGE:-essalud/backend}:${APP_VERSION:?Falta APP_VERSION}
    pull_policy: never
    entrypoint: [node]
    command: [scripts/migrar.js, --estado]
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/Lima}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-papeletas}
      DB_USER: ${DB_OWNER_USER:-papeletas_admin}
      DB_PASSWORD_FILE: /run/secrets/db_owner_password
      APP_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_owner_password, db_password]
    extra_hosts: [host.docker.internal:host-gateway]
    networks: [datos]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${BACKEND_MEMORY:-256m}
    healthcheck:
      disable: true
    logging: *registros

networks:
  publica:
  api:
    internal: true
  # Escenario B: debe alcanzar el PostgreSQL existente. El escenario A la vuelve interna (compose.prod.db.yml).
  datos:

secrets:
  db_owner_password:
    file: ../secretos/db_owner_password
  db_password:
    file: ../secretos/db_password
  jwt_secret:
    file: ../secretos/jwt_secret
