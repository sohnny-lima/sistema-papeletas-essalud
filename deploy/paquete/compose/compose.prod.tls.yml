# HTTPS propio (opcional): úselo solo si EsSalud no pone un proxy HTTPS delante (TLS=propio en .env).
# Reutiliza la imagen del frontend (Nginx sin privilegios) como proxy TLS. El certificado y la clave
# los entrega la institución; nunca se incluyen en el paquete.
services:
  proxy:
    image: ${FRONTEND_IMAGE:-essalud/frontend}:${APP_VERSION:?Falta APP_VERSION}
    pull_policy: never
    # El entrypoint de la imagen convierte la plantilla en /tmp/nginx-tls.conf (solo sustituye HTTPS_PUERTO_PUBLICO).
    command: [nginx, -c, /tmp/nginx-tls.conf, -g, "daemon off;"]
    environment:
      TZ: ${TZ:-America/Lima}
      HTTPS_PUERTO_PUBLICO: ${HTTPS_PORT:-443}
      NGINX_ENVSUBST_FILTER: HTTPS_PUERTO_PUBLICO
    volumes:
      - ./proxy/nginx-tls.conf.template:/etc/nginx/templates/nginx-tls.conf.template:ro
    secrets: [tls_certificado, tls_clave]
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTP_REDIRECT_PORT:-80}:8080"
    networks: [publica]
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-5}"

secrets:
  tls_certificado:
    file: ${TLS_CERTIFICADO:-../secretos/tls.crt}
  tls_clave:
    file: ${TLS_CLAVE:-../secretos/tls.key}
