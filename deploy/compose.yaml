x-registros: &registros
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-5}"

services:
  frontend:
    image: ${FRONTEND_IMAGE:-essalud/frontend}:${APP_VERSION:-1.0.0-rc.2}
    build:
      context: ../frontend-papeletas
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0-rc.2}
        VCS_REF: ${VCS_REF:-sin-revision}
        SOURCE_URL: ${SOURCE_URL:-entrega-essalud}
    environment:
      TZ: ${TZ:-America/Lima}
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    networks: [publica, api]
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${FRONTEND_MEMORY:-128m}
    logging: *registros

  backend:
    image: ${BACKEND_IMAGE:-essalud/backend}:${APP_VERSION:-1.0.0-rc.2}
    build:
      context: ../backend-papeletas
      # produccion (por defecto, sin datos de demostración) o pruebas (solo humo y E2E desechables).
      target: ${BACKEND_TARGET:-produccion}
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0-rc.2}
        VCS_REF: ${VCS_REF:-sin-revision}
        SOURCE_URL: ${SOURCE_URL:-entrega-essalud}
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${TZ:-America/Lima}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-papeletas}
      DB_USER: ${DB_USER:-papeletas_app}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-10000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-18000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}
      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED:-true}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CLIENT_URL: ${CLIENT_URL:-}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
    secrets: [db_password, jwt_secret]
    extra_hosts: [host.docker.internal:host-gateway]
    networks: [api, datos]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${BACKEND_MEMORY:-256m}
    logging: *registros

  operaciones:
    profiles: [herramientas]
    image: ${BACKEND_IMAGE:-essalud/backend}:${APP_VERSION:-1.0.0-rc.2}
    entrypoint: [node]
    command: [scripts/migrar.js, --estado]
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/Lima}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-papeletas}
      DB_USER: ${DB_OWNER_USER:-papeletas_admin}
      DB_PASSWORD_FILE: /run/secrets/db_owner_password
      APP_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_owner_password, db_password]
    extra_hosts: [host.docker.internal:host-gateway]
    networks: [datos]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${BACKEND_MEMORY:-256m}
    healthcheck:
      disable: true
    logging: *registros

networks:
  publica:
  api:
    internal: true
  # En B permite alcanzar PostgreSQL existente; A la convierte en interna.
  datos:

secrets:
  db_owner_password:
    file: ${DB_OWNER_PASSWORD_PATH:-./secretos/db_owner_password}
  db_password:
    file: ${DB_PASSWORD_PATH:-./secretos/db_password}
  jwt_secret:
    file: ${JWT_SECRET_PATH:-./secretos/jwt_secret}
